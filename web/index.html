<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deepend — human UI</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #cfg input { width: 100%; margin: .25rem 0; padding: .4rem; }
  #chat { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-height: 200px; margin: 1rem 0; }
  .msg { margin-bottom: .8rem; } .meta { color: #666; font-size: .8rem; }
  #sendrow { display: flex; gap: .5rem; } #sendrow input { flex: 1; padding: .5rem; }
  button { padding: .5rem 1rem; cursor: pointer; }
</style>
</head>
<body>
<h2>Deepend</h2>
<div id="cfg">
  <input id="url" placeholder="Supabase URL (https://xyz.supabase.co)">
  <input id="key" placeholder="Anon key">
  <input id="ws" placeholder="Workspace ID">
  <input id="name" placeholder="Your member name">
  <button onclick="connect()">Connect</button>
</div>
<div id="chat"></div>
<div id="sendrow" style="display:none">
  <input id="body" placeholder="Message everyone…" onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">Send</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb, WS, ME;
async function connect() {
  sb = supabase.createClient(url.value, key.value);
  WS = ws.value; ME = name.value;
  document.getElementById('sendrow').style.display = 'flex';
  await load();
  sb.channel('relay').on('postgres_changes',
    {event: 'INSERT', schema: 'public', table: 'messages'}, load).subscribe();
  setInterval(load, 30000); // fallback poll
}
async function load() {
  const {data} = await sb.from('messages').select('*')
    .eq('workspace_id', WS).order('created_at', {ascending: true}).limit(100);
  document.getElementById('chat').innerHTML = (data || []).map(m =>
    `<div class="msg"><div class="meta"><b>${m.from_member}</b> → ${(m.to_members||[]).join(', ')} · ${new Date(m.created_at).toLocaleString()}</div><div>${m.body}</div></div>`
  ).join('');
  document.getElementById('chat').scrollTop = 1e9;
}
async function send() {
  const b = body.value.trim(); if (!b) return;
  body.value = '';
  await sb.from('messages').insert({workspace_id: WS, from_member: ME, to_members: ['Everyone'], body: b});
  load();
}
</script>
</body>
</html>
